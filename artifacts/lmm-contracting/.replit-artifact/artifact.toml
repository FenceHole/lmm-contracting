kind = "web"
previewPath = "/"
title = "LMM Contracting LLC"
version = "1.0.0"
id = "artifacts/lmm-contracting"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22183
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/lmm-contracting run dev"

[services.env]
PORT = "22183"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/lmm-contracting", "run", "build"]
publicDir = "artifacts/lmm-contracting/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
